<!doctype html>

<!-- Template for tools/flipbook.py, which fills LANG, TITLE, EYEBROW, LEDE, FOOTER, CREDITS, TOPBAR, CSS,
     SECTIONS and SEQS. The CSS is web/style.css, inlined so the file stays self-contained. -->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<style>
{{CSS}}
  /* flipbook only: each scene is a TV with a console strip, then a timeline and notes */
  section.set { display: grid; gap: 16px; margin-top: 48px; }
  .set-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
  .tag { font-family: var(--mono); font-size: 13px; color: var(--phosphor); }
  .console { margin-top: 0; }
  .timeline {
    position: relative; height: 34px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
  }
  .seg {
    position: absolute; top: 8px; height: 18px; line-height: 18px; padding: 0 6px;
    border-left: 2px solid var(--amber); color: var(--amber); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; box-sizing: border-box;
  }
  .tick { position: absolute; top: 0; height: 100%; border-left: 2px solid var(--phosphor); color: var(--phosphor); padding-left: 6px; line-height: 34px; }
  .head { position: absolute; top: 0; height: 100%; width: 2px; background: var(--ink); opacity: 0.9; }
</style>
</head>
<body>
<main>
  <header class="site">
    {{TOPBAR}}
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{TITLE}}</h1>
    <p class="lede">{{LEDE}}</p>
  </header>
{{SECTIONS}}
  <footer class="site"><p>{{FOOTER}}</p><p>{{CREDITS}}</p></footer>
</main>

<script>
  const SEQS = /*SEQS*/;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function flip(seq) {
    const id = seq.id, frames = seq.frames, fps = seq.fps;
    const canvas = document.getElementById(id + "-canvas"), ctx = canvas.getContext("2d");
    const play = document.getElementById(id + "-play"), scrub = document.getElementById(id + "-scrub");
    const speed = document.getElementById(id + "-speed"), readout = document.getElementById(id + "-readout");
    const timeline = document.getElementById(id + "-timeline");
    const n = frames.length, dur = n / fps;
    const imgs = frames.map(src => { const im = new Image(); im.src = src; return im; });
    let i = 0, playing = !reduced, acc = 0, last = null;

    for (const m of seq.marks) {
      const el = document.createElement("div");
      const a = (m.t0 - seq.t0) / dur * 100;
      if (m.t1 === undefined) {
        el.className = "tick"; el.style.left = a + "%";
      } else {
        el.className = "seg"; el.style.left = a + "%"; el.style.width = ((m.t1 - m.t0) / dur * 100) + "%";
      }
      el.textContent = m.label; timeline.appendChild(el);
    }
    const head = document.createElement("div"); head.className = "head"; timeline.appendChild(head);

    function show(k) {
      i = k;
      const im = imgs[i];
      if (im.complete) ctx.drawImage(im, 0, 0); else im.onload = () => { if (i === k) ctx.drawImage(im, 0, 0); };
      scrub.value = i;
      const t = seq.t0 + i / fps;
      readout.textContent = "t = " + t.toFixed(2) + " s · frame " + (i + 1) + "/" + n;
      head.style.left = (i / fps / dur * 100) + "%";
    }
    function label() { play.textContent = playing ? "Pause" : "Play"; }
    function tick(now) {
      if (last === null) last = now;
      if (playing) {
        acc += (now - last) / 1000 * parseFloat(speed.value);
        const step = 1 / fps;
        if (acc >= step) { const adv = Math.floor(acc / step); acc -= adv * step; show((i + adv) % n); }
      }
      last = now;
      requestAnimationFrame(tick);
    }
    play.addEventListener("click", () => { playing = !playing; label(); });
    scrub.addEventListener("input", () => { show(parseInt(scrub.value, 10)); acc = 0; });
    show(0); label();
    requestAnimationFrame(tick);
  }

  for (const seq of SEQS) flip(seq);
</script>
</body>
</html>
