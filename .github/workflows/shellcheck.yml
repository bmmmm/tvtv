# shellcheck over the shell scripts, only when one of them changes.
name: shellcheck

on:
  push:
    paths: ["**.sh", ".github/workflows/shellcheck.yml"]
  pull_request:
    paths: ["**.sh", ".github/workflows/shellcheck.yml"]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
