# tvtv remote control: user zapper gets exactly one program, the dispatcher, and only with a key.
# tools/setup-remote.sh installs this as /etc/ssh/sshd_config.d/50-tvtv.conf.
Match User zapper
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/tvtv/authorized_keys
    ForceCommand /usr/local/lib/tvtv/tv-dispatch
    ExposeAuthInfo yes
    PermitTTY yes
    DisableForwarding yes
    PermitUserRC no
    X11Forwarding no
    MaxSessions 4
    ClientAliveInterval 30
    ClientAliveCountMax 4
# Closes the block: Debian includes this directory at the top of sshd_config, and without this
# line the main file's remaining global settings would fall into the Match block above.
Match all
